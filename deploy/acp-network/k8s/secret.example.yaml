apiVersion: v1
kind: Secret
metadata:
  name: dsh-acp-network-secret
type: Opaque
stringData:
  # Shared secret used to sign and validate ACP authentication tokens.
  secret: CHANGE_ME
  # Expected token subject (sub claim). Must match DSH_FLEET_USER_ID.
  subject: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: dsh-provider-secret
type: Opaque
stringData:
  DEEPSEEK_API_KEY: CHANGE_ME
