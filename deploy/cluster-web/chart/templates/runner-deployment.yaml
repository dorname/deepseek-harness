{{- if gt (int .Values.runnerReplicas) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.runnerReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-runner
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-runner
    spec:
      containers:
        - name: runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The cluster-web-runner profile owns the composition (Postgres
          # persistence, session lease, dispatch loop with runner: true); the
          # Pod name is the lease identity. Requires the shared Postgres
          # (postgres.enabled); without DATABASE_URL the pod fails at mount.
          command:
            - node
            - --import
            - tsx/esm
            - apps/cli/src/bin.ts
            - --profile
            - cluster-web-runner
            - --no-open
            - --host
            - 127.0.0.1
            - --port
            - "3180"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          env:
            - name: DSH_CONFIG_READONLY
              value: {{ .Values.configReadonly | quote }}
            - name: DSH_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.resources.runner | nindent 12 }}
{{- end }}
