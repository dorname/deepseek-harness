apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - deploy/cluster-web/frontend.mts
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          env:
            - name: SHELL_PORT
              value: {{ .Values.shell.containerPort | quote }}
            - name: API_UPSTREAMS
              value: "{{ .Release.Name }}-api:{{ .Values.api.forwardPort }}"
            - name: DSH_HOME
              value: /dsh-home
          ports:
            - containerPort: {{ .Values.edge.port }}
              name: http
          resources:
            {{- toYaml .Values.resources.shell | nindent 12 }}
      volumes:
        - name: dsh-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dsh-home
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - port: 80
      targetPort: http
      name: http
