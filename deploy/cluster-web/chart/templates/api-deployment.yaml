apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.apiReplicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - 'until pg_isready -h "$1" -U "$2" -d "$3"; do sleep 1; done'
            - wait-postgres
            - {{ printf "%s-postgres" .Release.Name | quote }}
            - {{ .Values.postgres.user | quote }}
            - {{ .Values.postgres.database | quote }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - deploy/cluster-web/api.mts
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          env:
            - name: FORWARD_PORT
              value: {{ .Values.api.forwardPort | quote }}
            - name: API_LOOPBACK_PORT
              value: {{ .Values.api.loopbackPort | quote }}
            - name: FORWARD_HEALTH_TIMEOUT_MS
              value: {{ .Values.api.healthTimeoutMs | quote }}
            - name: DSH_HOME
              value: /dsh-home
          ports:
            - containerPort: {{ .Values.api.forwardPort }}
              name: forward
          readinessProbe:
            httpGet:
              path: /healthz
              port: forward
            {{- toYaml .Values.api.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: forward
            {{- toYaml .Values.api.probes.liveness | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: forward
            {{- toYaml .Values.api.probes.startup | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - name: dsh-home
              mountPath: /dsh-home
      volumes:
        - name: dsh-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dsh-home
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.forwardPort }}
      targetPort: forward
      name: forward
