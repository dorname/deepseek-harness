apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.apiReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      # Share Pod network so edge reaches shell + API on 127.0.0.1
      # without binding dsh to 0.0.0.0 (product safety rule).
      shareProcessNamespace: false
      containers:
        - name: shell
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - apps/cli/src/bin.ts
            - --profile
            - web
            - --no-open
            - --host
            - 127.0.0.1
            - --port
            - {{ .Values.shell.containerPort | quote }}
            - --public-url
            - $(PUBLIC_URL)
            - --trusted-host
            - $(TRUSTED_HOST)
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          resources:
            {{- toYaml .Values.resources.shell | nindent 12 }}
        - name: dsh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - apps/cli/src/bin.ts
            - --profile
            - web
            - --api-only
            - --no-open
            - --host
            - 127.0.0.1
            - --port
            - {{ .Values.api.containerPort | quote }}
            - --public-url
            - $(PUBLIC_URL)
            - --trusted-host
            - $(TRUSTED_HOST)
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
        - name: edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - deploy/cluster-web/edge.mts
          env:
            - name: EDGE_PORT
              value: {{ .Values.edge.port | quote }}
            - name: STATIC_UPSTREAM
              value: "127.0.0.1:{{ .Values.shell.containerPort }}"
            - name: API_UPSTREAMS
              value: "127.0.0.1:{{ .Values.api.containerPort }}"
          ports:
            - containerPort: {{ .Values.edge.port }}
              name: http
          resources:
            {{- toYaml .Values.resources.edge | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: 80
      targetPort: http
      name: http
