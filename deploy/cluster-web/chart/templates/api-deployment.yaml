apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.apiReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - deploy/cluster-web/api.mts
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          env:
            - name: FORWARD_PORT
              value: {{ .Values.api.forwardPort | quote }}
            - name: API_LOOPBACK_PORT
              value: {{ .Values.api.loopbackPort | quote }}
            - name: DSH_HOME
              value: /dsh-home
          ports:
            - containerPort: {{ .Values.api.forwardPort }}
              name: forward
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
      volumes:
        - name: dsh-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dsh-home
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.forwardPort }}
      targetPort: forward
      name: forward
