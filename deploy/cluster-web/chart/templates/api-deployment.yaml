apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.apiReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: dsh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - apps/cli/src/bin.ts
            - --profile
            - web
            - --api-only
            - --no-open
            - --host
            - 127.0.0.1
            - --port
            - {{ .Values.api.loopbackPort | quote }}
            - --public-url
            - $(PUBLIC_URL)
            - --trusted-host
            - $(TRUSTED_HOST)
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-cluster-web
          volumeMounts:
            - name: dsh-home
              mountPath: /dsh-home
          env:
            - name: DSH_HOME
              value: /dsh-home
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
        - name: forward
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - node
            - --import
            - tsx/esm
            - deploy/cluster-web/forward.mts
          env:
            - name: FORWARD_PORT
              value: {{ .Values.api.forwardPort | quote }}
            - name: LOOPBACK_UPSTREAM
              value: "127.0.0.1:{{ .Values.api.loopbackPort }}"
          ports:
            - containerPort: {{ .Values.api.forwardPort }}
              name: forward
          resources:
            {{- toYaml .Values.resources.edge | nindent 12 }}
      volumes:
        - name: dsh-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dsh-home
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: {{ .Values.api.forwardPort }}
      targetPort: forward
      name: forward
