# Acceptance defaults — keep low for smoke; hard cap is 2 (enforced by notes + SMOKE-core-22).
apiReplicas: 1
runnerReplicas: 0

image:
  repository: dsh-cluster-web
  tag: local
  pullPolicy: IfNotPresent

edge:
  port: 8080

shell:
  containerPort: 3079
  # SPA + token exchange; edge STATIC_UPSTREAM (S46).

api:
  # In-network forwarder (Service target); dsh stays on loopbackPort.
  forwardPort: 3080
  loopbackPort: 13080
  # Probe the protected loopback API without a user cookie; 401 proves HTTP readiness.
  healthTimeoutMs: 1000
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 60
    readiness:
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    liveness:
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

dshHome:
  storage: 1Gi
  storageClassName: ""

publicUrl: http://127.0.0.1/
trustedHost: 127.0.0.1

postgres:
  enabled: true
  image: postgres:16-alpine
  user: dsh
  password: dsh
  database: dsh

ingress:
  enabled: true
  className: ""
  host: ""
  # Same-origin: / → api Service (edge); /api → same Service (edge round-robins upstream).

resources:
  shell:
    limits:
      cpu: "1500m"
      memory: 2Gi
  api:
    limits:
      cpu: "1"
      memory: 1Gi
  runner:
    limits:
      cpu: "1"
      memory: 1Gi

# Cluster config is read-only (disables HMR).
configReadonly: "1"
