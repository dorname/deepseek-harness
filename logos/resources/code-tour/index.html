<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DeepSeek Harness Code Tour</title>
<style>
/* DeepSeek Harness Code Tour — 离线单文件样式 */

:root {
  --bg: #0d1117;
  --bg-soft: #161b27;
  --bg-card: #1a2130;
  --bg-card-hover: #212a3d;
  --line: #2c3648;
  --text: #e6edf6;
  --text-dim: #9aa7bc;
  --text-faint: #6b7a93;
  --accent: #38bdf8;

  /* 层语义色：protocol / runtime / storage / extension / host / external */
  --layer-protocol: #a78bfa;
  --layer-runtime: #38bdf8;
  --layer-storage: #34d399;
  --layer-extension: #fbbf24;
  --layer-host: #f472b6;
  --layer-external: #94a3b8;

  /* 关系语义色 */
  --edge-main: #22d3ee;
  --edge-support: #64748b;
  --edge-orchestration: #a78bfa;
  --edge-planned: #475569;

  /* 依赖高亮 */
  --hl-deps: #38bdf8;
  --hl-dependents: #fb923c;

  --ver-verified: #34d399;
  --ver-partial: #fbbf24;
  --ver-unverified: #f87171;

  --mono: "SFMono-Regular", ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  overflow: hidden;
}

/* ── 顶栏 ─────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 52px;
  padding: 0 16px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
}
.brand h1 {
  margin: 0;
  font-size: 16px;
  letter-spacing: .5px;
  white-space: nowrap;
}
.brand em { font-style: normal; color: var(--accent); }
.brand small {
  display: block;
  font-size: 10px;
  color: var(--text-faint);
  font-weight: normal;
  letter-spacing: 0;
}
.tabs { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; }
.tabs button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}
.tabs button:hover { background: var(--bg-card); color: var(--text); }
.tabs button.active { background: var(--bg-card); color: var(--accent); font-weight: 600; }

.search-wrap { position: relative; width: 300px; flex-shrink: 0; }
.search-wrap input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  padding: 6px 10px;
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-results {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 420px;
  max-height: 60vh;
  overflow-y: auto;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
  z-index: 50;
}
.search-results.open { display: block; }
.search-hit {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  color: var(--text);
  font: inherit;
  padding: 8px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
}
.search-hit:last-child { border-bottom: 0; }
.search-hit:hover { background: var(--bg-card-hover); }
.search-hit .hit-kind {
  display: inline-block;
  font-size: 10px;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 0 5px;
  margin-right: 8px;
  vertical-align: 1px;
}
.search-hit .hit-sub { display: block; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
.search-empty { padding: 12px; color: var(--text-faint); }

/* ── 主布局 ───────────────────────────────────────── */
.shell { display: flex; height: calc(100% - 52px); }
.main { flex: 1; min-width: 0; overflow: auto; padding: 18px; position: relative; }
.side {
  width: 380px;
  flex-shrink: 0;
  border-left: 1px solid var(--line);
  background: var(--bg-soft);
  display: flex;
  flex-direction: column;
}
.side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
.side-head h2 { margin: 0; font-size: 14px; color: var(--text-dim); }
.side-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.detail-empty { color: var(--text-faint); padding: 8px 2px; }

/* ── 通用组件 ─────────────────────────────────────── */
.btn {
  appearance: none;
  font: inherit;
  font-size: 12px;
  color: var(--text);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 10px;
  cursor: pointer;
}
.btn:hover { background: var(--bg-card-hover); border-color: var(--accent); }
.btn.ghost { background: transparent; color: var(--text-dim); }
.btn.ghost:hover { color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #06202e; font-weight: 600; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.badge {
  display: inline-block;
  font-size: 10px;
  border-radius: 4px;
  padding: 1px 6px;
  border: 1px solid;
  vertical-align: 1px;
}
.badge.verified { color: var(--ver-verified); border-color: var(--ver-verified); }
.badge.partial { color: var(--ver-partial); border-color: var(--ver-partial); }
.badge.unverified { color: var(--ver-unverified); border-color: var(--ver-unverified); }

.chip {
  display: inline-block;
  font-size: 11px;
  color: var(--text-dim);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 8px;
  margin: 0 4px 4px 0;
}
.chip.layer-protocol { color: var(--layer-protocol); border-color: var(--layer-protocol); }
.chip.layer-runtime { color: var(--layer-runtime); border-color: var(--layer-runtime); }
.chip.layer-storage { color: var(--layer-storage); border-color: var(--layer-storage); }
.chip.layer-extension { color: var(--layer-extension); border-color: var(--layer-extension); }
.chip.layer-host { color: var(--layer-host); border-color: var(--layer-host); }
.chip.layer-external { color: var(--layer-external); border-color: var(--layer-external); }

.file-link {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: left;
  word-break: break-all;
}
.file-link:hover { text-decoration: underline; }
.sym { font-family: var(--mono); font-size: 12px; color: #c3e88d; }

.detail h3 { margin: 4px 0 10px; font-size: 16px; }
.detail dl { margin: 0; }
.detail dt {
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-top: 14px;
}
.detail dd { margin: 3px 0 0; }
.detail .rel-list { margin: 4px 0 0; padding: 0; list-style: none; }
.detail .rel-list li { margin: 2px 0; }
.rel-link {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
}
.rel-link:hover { text-decoration: underline; }
.evidence-block {
  margin-top: 14px;
  font-size: 12px;
  color: var(--text-dim);
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 8px 10px;
}

/* ── 概览视图 ─────────────────────────────────────── */
.hero h2 { margin: 0 0 6px; font-size: 22px; }
.hero p.lead { color: var(--text-dim); max-width: 860px; margin: 0 0 4px; }
.hero .one-line {
  font-size: 15px;
  color: var(--text);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 14px 0;
  max-width: 860px;
}
.ov-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
  margin-top: 18px;
  max-width: 1100px;
}
.ov-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
}
.ov-card h4 { margin: 0 0 6px; font-size: 13px; color: var(--accent); }
.ov-card p { margin: 0; font-size: 12.5px; color: var(--text-dim); }
.ov-stats { margin: 18px 0 0; color: var(--text-faint); font-size: 12px; }
.ov-stats b { color: var(--text); }
.section-title { margin: 26px 0 10px; font-size: 15px; }

/* ── 图画布（架构 / 依赖 / 执行流共用） ───────────── */
.canvas-tools {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
}
.canvas-tools .spacer { flex: 1; }
.canvas-tools .hint { font-size: 11px; color: var(--text-faint); }
.canvas-scroll { overflow-x: auto; padding-bottom: 8px; }
.canvas {
  position: relative;
  min-width: 900px;
  transition: transform .12s ease;
  transform-origin: top left;
}
.canvas svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.edge-path { fill: none; stroke-width: 1.6; }
.edge-path.edge-main { stroke: var(--edge-main); stroke-width: 2.2; }
.edge-path.edge-support { stroke: var(--edge-support); }
.edge-path.edge-orchestration { stroke: var(--edge-orchestration); stroke-dasharray: 6 4; }
.edge-path.edge-planned { stroke: var(--edge-planned); stroke-dasharray: 4 4; }
.edge-path.hl-deps { stroke: var(--hl-deps); stroke-width: 2.6; }
.edge-path.hl-dependents { stroke: var(--hl-dependents); stroke-width: 2.6; }
.edge-path.dimmed { opacity: .14; }
.edge-label { font-size: 10px; fill: var(--text-faint); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }

/* 泳道架构图 */
.lanes { display: flex; gap: 14px; align-items: stretch; }
.lane { flex: 1; min-width: 168px; }
.lane-head {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-faint);
  border-bottom: 1px dashed var(--line);
  padding-bottom: 5px;
  margin-bottom: 10px;
}
.node {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-radius: 8px;
  padding: 8px 10px;
  margin: 0 0 10px;
  cursor: pointer;
  transition: background .12s ease, border-color .12s ease;
}
.node:hover { background: var(--bg-card-hover); }
.node.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.node.hl-deps { border-color: var(--hl-deps); box-shadow: 0 0 0 1px var(--hl-deps); }
.node.hl-dependents { border-color: var(--hl-dependents); box-shadow: 0 0 0 1px var(--hl-dependents); }
.node.dimmed { opacity: .3; }
.node .n-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.node .n-sub { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 2px; word-break: break-all; }
.node .n-desc { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }

/* 依赖图节点复用 .node，网格布局 */
.dep-grid { display: flex; gap: 14px; }
.dep-col { flex: 1; min-width: 170px; }

/* ── 执行流视图 ───────────────────────────────────── */
.flow-lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.flow-card {
  text-align: left;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.flow-card:hover { background: var(--bg-card-hover); border-color: var(--accent); }
.flow-card h4 { margin: 0 0 4px; font-size: 14px; }
.flow-card .fc-meta { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; }
.flow-card p { margin: 0; font-size: 12px; color: var(--text-dim); }
.flow-head { margin: 0 0 10px; }
.flow-head h3 { margin: 0 0 4px; font-size: 18px; }
.flow-head p { margin: 0; color: var(--text-dim); font-size: 13px; }
.flow-steps { position: relative; padding-left: 30px; }
.flow-steps::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--line);
}
.flow-node {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 12px;
  margin: 0 0 14px;
  cursor: pointer;
  max-width: 720px;
}
.flow-node::before {
  content: "";
  position: absolute;
  left: -25px;
  top: 14px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--edge-main);
  box-shadow: 0 0 0 3px var(--bg);
}
.flow-node:hover { background: var(--bg-card-hover); }
.flow-node.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
.flow-node .fn-idx {
  display: inline-block;
  font-size: 10px;
  color: var(--edge-main);
  border: 1px solid var(--edge-main);
  border-radius: 4px;
  padding: 0 5px;
  margin-right: 8px;
}
.flow-node .fn-title { font-weight: 600; font-size: 13px; }
.flow-node .fn-meta { font-size: 11px; color: var(--text-faint); font-family: var(--mono); margin-top: 3px; word-break: break-all; }
.flow-backedge-note {
  max-width: 720px;
  font-size: 11.5px;
  color: var(--ver-partial);
  border: 1px dashed var(--ver-partial);
  border-radius: 8px;
  padding: 6px 10px;
  margin: -6px 0 14px;
}

/* ── 模块视图 ─────────────────────────────────────── */
.mod-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }

/* ── 阅读路线 ─────────────────────────────────────── */
.path-step {
  display: flex;
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 12px;
  max-width: 920px;
}
.path-idx {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--accent);
  color: var(--accent);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.path-body h4 { margin: 0 0 4px; font-size: 14px; }
.path-body p { margin: 2px 0; font-size: 12.5px; color: var(--text-dim); }
.path-body .why { color: var(--text); }
.path-skip { color: var(--text-faint); font-size: 11.5px; }

/* ── toast ────────────────────────────────────────── */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card);
  border: 1px solid var(--accent);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 99;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 窄屏 ─────────────────────────────────────────── */
@media (max-width: 1100px) {
  body { overflow: auto; }
  .shell { flex-direction: column; height: auto; }
  .side { width: 100%; border-left: 0; border-top: 1px solid var(--line); max-height: 46vh; }
  .search-wrap { width: 200px; }
  .brand small { display: none; }
}
@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; height: auto; padding: 8px 12px; }
  .tabs { order: 3; width: 100%; }
  .search-wrap { flex: 1; width: auto; }
  .search-results { width: 100%; }
  .main { padding: 12px; }
}
</style>
</head>

</div>

/* ── 基础工具 ─────────────────────────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const key of Object.keys(attrs)) {
      const value = attrs[key];
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? '' : String(value));
    }
  }
  (children || []).forEach(child => {
    if (child === null || child === undefined || child === false) return;
    node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  });
  return node;
}

function layerClass(layer) { return 'layer-' + layer; }
function verBadge(verification) {
  if (!verification) return '';
  const label = { verified: '已验证', partial: '部分验证', unverified: '未验证' }[verification] || verification;
  return el('span', { class: 'badge ' + verification, text: label });

function fileBtn(path) {

  });

let toastTimer = null;
function toast(message) {
  let node = $('.toast');
  if (!node) { node = el('div', { class: 'toast' }); document.body.appendChild(node); }
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), 1800);
}

function copyText(text) {
  const done = () => toast('已复制：' + text);
  const fail = () => toast(text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fail);
  } else { fail(); }
}

/* ── 状态与历史 ───────────────────────────────────────── */
const state = {
  view: 'overview',
  flowId: null,
  depsMode: 'main',
  sel: null,          // { kind, id, flowId? }
  history: [],
};

const STORAGE_KEY = 'dsh-code-tour-state';
function saveState() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
      view: state.view, flowId: state.flowId, depsMode: state.depsMode, sel: state.sel,
    }));
  } catch (err) { /* 隐身模式等场景下 sessionStorage 不可用，状态保持降级为内存态 */ }
}
function restoreState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && VIEW_TITLES[saved.view]) {
      state.view = saved.view;
      state.flowId = saved.flowId || null;
      state.depsMode = saved.depsMode || 'main';
      state.sel = saved.sel || null;
    }
  } catch (err) { /* 损坏的存档视为无状态 */ }
}

function snapshot() {
  return { view: state.view, flowId: state.flowId, depsMode: state.depsMode, sel: state.sel };
}
function pushHistory() {
  state.history.push(snapshot());
  if (state.history.length > 60) state.history.shift();
}
function goBack() {
  const prev = state.history.pop();
  if (!prev) { toast('已在最上层'); return; }
  state.view = prev.view;
  state.flowId = prev.flowId;
  state.depsMode = prev.depsMode;
  state.sel = prev.sel;
  render();
}
function apply(next) {
  pushHistory();
  Object.assign(state, next);
  saveState();
  render();
}

/* ── 数据索引 ─────────────────────────────────────────── */
const overviewById = {};
TOUR.overviewNodes.forEach(node => { overviewById[node.id] = node; });
const moduleById = {};
TOUR.modules.forEach(mod => { moduleById[mod.id] = mod; });
const flowById = TOUR.flows || {};

function flowsForModule(moduleId) {
  return Object.keys(flowById).filter(flowId =>
    flowById[flowId].nodes.some(node => node.crate === moduleId));
}
function flowNodeNeighbors(flowId, nodeId) {
  const flow = flowById[flowId];
  const ups = [];
  const downs = [];
  flow.edges.forEach(edge => {
    const from = Array.isArray(edge) ? edge[0] : edge.from;
    const to = Array.isArray(edge) ? edge[1] : edge.to;
    if (to === nodeId) ups.push(from);
    if (from === nodeId) downs.push(to);
  });
  return {
    ups: ups.map(id => flow.nodes.find(node => node.id === id)),
    downs: downs.map(id => flow.nodes.find(node => node.id === id)),
  };
}

/* ── SVG 连线 ─────────────────────────────────────────── */
const EDGE_COLORS = {
  main: '#22d3ee', support: '#64748b', orchestration: '#a78bfa',
  planned: '#475569', loop: '#fbbf24', 'hl-deps': '#38bdf8', 'hl-dependents': '#fb923c',
};
function edgeKey(edge) {
  return (Array.isArray(edge) ? edge[0] : edge.from) + '→' + (Array.isArray(edge) ? edge[1] : edge.to);
}
function edgeEnds(edge) {
  return Array.isArray(edge) ? [edge[0], edge[1]] : [edge.from, edge.to];
}

function drawEdges(canvas, edges, highlight) {
  const svg = canvas.querySelector('svg.edges');
  if (!svg) return;
  svg.innerHTML = '';
  const width = canvas.offsetWidth;
  const height = canvas.offsetHeight;
  svg.setAttribute('width', String(width));
  svg.setAttribute('height', String(height));
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  const defs = elSVG('defs', {});
  let markers = '';
  Object.keys(EDGE_COLORS).forEach(kind => {
    markers += '<marker id="arrow-' + kind + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="' + EDGE_COLORS[kind] + '"/></marker>';
  });
  defs.innerHTML = markers;
  svg.appendChild(defs);

  const boxes = {};
  $$('[data-node-id]', canvas).forEach(node => {
    boxes[node.getAttribute('data-node-id')] = {
      x: node.offsetLeft, y: node.offsetTop, w: node.offsetWidth, h: node.offsetHeight,
    };
  });

  const used = {};
  edges.forEach(edge => {
    const parts = edgeEnds(edge);
    const key = edgeKey(edge);
    const kind = (edge && edge.kind) || 'main';
    const a = boxes[parts[0]];
    const b = boxes[parts[1]];
    if (!a || !b) return;
    const hlKind = highlight && highlight.set[key];
    const markerKind = hlKind || kind;
    let pathD;
    let labelAt = null;
    const loop = kind === 'loop' || b.y + b.h <= a.y + 4;
    if (loop) {
      const serial = (used[key] = (used[key] || 0) + 1);
      const sx = a.x + a.w;
      const sy = a.y + a.h / 2;
      const ex = b.x + b.w;
      const ey = b.y + b.h / 2;
      const reach = Math.max(a.x + a.w, b.x + b.w);
      const dx = 46 + serial * 22 + Math.max(0, (sx - ex)) * 0.25;
      const mx = reach + dx;
      pathD = 'M ' + sx + ' ' + sy + ' C ' + mx + ' ' + sy + ', ' + mx + ' ' + ey + ', ' + ex + ' ' + ey;
      labelAt = { x: mx + 4, y: (sy + ey) / 2 };
    } else {
      const sameLane = Math.abs(a.x - b.x) < a.w / 2;
      let sx; let sy; let ex; let ey;
      if (sameLane) {
        sx = a.x + a.w; sy = a.y + a.h / 2;
        ex = b.x + b.w; ey = b.y + b.h / 2;
        const mx = Math.max(sx, ex) + 26;
        pathD = 'M ' + sx + ' ' + sy + ' C ' + mx + ' ' + sy + ', ' + mx + ' ' + ey + ', ' + ex + ' ' + ey;
        labelAt = { x: mx + 4, y: (sy + ey) / 2 };
      } else {
        sx = a.x + a.w / 2; sy = a.y + a.h;
        ex = b.x + b.w / 2; ey = b.y;
        const bend = sy + (ey - sy) * 0.45;
        pathD = 'M ' + sx + ' ' + sy + ' C ' + sx + ' ' + bend + ', ' + ex + ' ' + bend + ', ' + ex + ' ' + ey;
        labelAt = { x: (sx + ex) / 2, y: bend - 4 };
      }
    }
    const dimmed = highlight && !hlKind && !highlight.keep.has(key);
    const path = elSVG('path', {
      d: pathD,
      class: 'edge-path ' + (hlKind ? 'hl-' + hlKind : 'edge-' + kind) + (dimmed ? ' dimmed' : ''),
    });
    if (!dimmed) path.setAttribute('marker-end', 'url(#arrow-' + markerKind + ')');
    svg.appendChild(path);
    if (edge.label && labelAt) {
      const text = elSVG('text', { class: 'edge-label', x: labelAt.x, y: labelAt.y, 'text-anchor': 'middle' });
      text.textContent = edge.label;
      svg.appendChild(text);
    }
  });
}

function elSVG(tag, attrs) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const key of Object.keys(attrs || {})) {
    if (attrs[key] !== null && attrs[key] !== undefined) node.setAttribute(key, attrs[key]);
  }
  return node;
}

/* ── 缩放 ─────────────────────────────────────────────── */
function activeCanvas() { return $('#main .canvas'); }
function applyZoom(canvas, scale) {
  canvas.__scale = scale;
  canvas.style.transform = 'scale(' + scale + ')';
  const holder = canvas.parentElement;
  holder.style.width = canvas.offsetWidth * scale + 'px';
  holder.style.height = canvas.offsetHeight * scale + 'px';
}
function onZoomClick(event) {
  const button = event.target.closest('[data-zoom]');
  if (!button) return;
  const canvas = activeCanvas();
  if (!canvas) return;
  const current = canvas.__scale || 1;
  const mode = button.getAttribute('data-zoom');
  const next = mode === 'in' ? Math.min(2, current * 1.15)
    : mode === 'out' ? Math.max(0.5, current / 1.15) : 1;
  applyZoom(canvas, next);
}

/* ── 视图：系统架构（泳道） ───────────────────────────── */
function nodeCard(node, kind) {
  // 选中语义与 deps 视图一致：蓝=选中节点的上游（它调用），橙=下游（调用它），其余变暗。
  let extra = '';
  const sel = state.sel && state.sel.kind === kind ? state.sel : null;
  if (sel && sel.id !== node.id) {
    const selected = overviewById[sel.id];
    if (selected) {
      if ((selected.dependsOn || []).includes(node.id)) extra = ' hl-deps';
      else if ((selected.usedBy || []).includes(node.id)) extra = ' hl-dependents';
      else extra = ' dimmed';
    }
  }
  return el('div', {
    class: 'node' + (sel && sel.id === node.id ? ' selected' : '') + extra,
    'data-kind': kind, 'data-id': node.id, 'data-node-id': node.id,
    style: 'border-left-color:var(--layer-' + node.layer + ')',
  }, [
    el('div', { class: 'n-title', text: node.label }),
    el('div', { class: 'n-sub', text: (node.packages || []).join(' ') || '' }),
    el('div', { class: 'n-desc', text: node.responsibility || '' }),
  ]);
}

function buildArchitectureCanvas(hint) {
  const tools = el('div', { class: 'canvas-tools' }, [

  const lanesWrap = el('div', { class: 'lanes' });
  LANE_ORDER.forEach(layer => {
    const lane = el('div', { class: 'lane' });

function overviewHighlight() {
  if (!state.sel || state.sel.kind !== 'overview-node') return null;
  const node = overviewById[state.sel.id];
  if (!node) return null;
  const set = {};
  const keep = new Set();
  // 边语义为“调用方 → 被调方”：出边是它调用的组件（上游），入边是调用它的组件（下游）。
  TOUR.overviewEdges.forEach(edge => {
    const parts = edgeEnds(edge);
    const key = edgeKey(edge);
    keep.add(key);
    if (parts[0] === node.id && (node.dependsOn || []).includes(parts[1])) set[key] = 'deps';
    if (parts[1] === node.id && (node.usedBy || []).includes(parts[0])) set[key] = 'dependents';
  });
  return { set, keep };
}

/* ── 视图：依赖图 ─────────────────────────────────────── */
const DEP_ROLES = ['runtime', 'protocol', 'host', 'storage', 'extension', 'external'];
function depEdgesFor(mode) {
  const mainChain = TOUR.meta.depMainChain || [];
  return TOUR.modules.reduce((acc, mod) => {
    (mod.deps || []).forEach(dep => {
      const inMain = mainChain.includes(mod.id) && mainChain.includes(dep);
      const adjacentToSel = state.sel && state.sel.kind === 'module' &&
        (mod.id === state.sel.id || dep === state.sel.id);
      if (mode === 'main' && !inMain && !adjacentToSel) return;
      acc.push({ from: dep, to: mod.id, kind: 'main', label: '' });
    });
    return acc;
  }, []);
}

function renderDeps(main) {
  const tools = el('div', { class: 'canvas-tools' }, [

  DEP_ROLES.forEach(role => {

function moduleHighlight() {
  if (!state.sel || state.sel.kind !== 'module') return null;
  const mod = moduleById[state.sel.id];

  const set = {};

      if (item.id === mod.id) set[key] = 'deps';
      if (dep === mod.id) set[key] = 'dependents';
    });

  return { set, keep };

  flow.nodes.forEach((node, index) => {
    steps.appendChild(el('div', {
      class: 'flow-node' + (state.sel && state.sel.kind === 'flow-node' && state.sel.id === node.id ? ' selected' : ''),
      'data-kind': 'flow-node', 'data-id': node.id, 'data-node-id': node.id,
    }, [
      el('span', { class: 'fn-idx', text: String(index + 1) }),
      el('span', { class: 'fn-title', text: node.label }),
      el('div', { class: 'fn-meta', text: [node.crate, node.file, node.symbol].filter(Boolean).join(' · ') }),
    ]));
  });
  canvas.appendChild(steps);
  canvas.appendChild(elSVG('svg', { class: 'edges' }));
  holder.appendChild(canvas);
  scroll.appendChild(holder);
  main.appendChild(tools);
  main.appendChild(scroll);
  requestAnimationFrame(() => {
    drawEdges(canvas, flow.edges, null);
    if (canvas.__scale) applyZoom(canvas, canvas.__scale);
  });
}

/* ── 视图：模块浏览器 ─────────────────────────────────── */
function renderModules(main) {
  main.appendChild(el('div', { class: 'flow-head' }, [
    el('h3', { text: '模块浏览器' }),
    el('p', { text: '核心模块的 manifest 级依赖；点击模块查看关键文件、符号与相关执行流，或在依赖图中定位。' }),
  ]));
  const list = el('div', { class: 'mod-list' });
  TOUR.modules.forEach(mod => {
    list.appendChild(el('div', {
      class: 'node', 'data-kind': 'module', 'data-id': mod.id,
      style: 'border-left-color:var(--layer-' + (mod.role || 'runtime') + ');cursor:pointer;margin:0',
    }, [
      el('div', { class: 'n-title', text: mod.id }),
      el('div', { class: 'n-sub', text: (mod.packages || []).join(' ') }),
      el('div', { class: 'n-desc', text: mod.responsibility || '' }),
      el('div', { class: 'n-desc', text: 'deps: ' + ((mod.deps || []).join(', ') || '—') }),
    ]));
  });
  main.appendChild(list);
}

/* ── 视图：阅读路线 ───────────────────────────────────── */
function renderPath(main) {
  main.appendChild(el('div', { class: 'flow-head' }, [
    el('h3', { text: '推荐阅读路线' }),
    el('p', { text: '自顶向下的钻取顺序；每步只读少量文件与符号。' }),
  ]));
  TOUR.readingPath.forEach((step, index) => {
    const body = el('div', { class: 'path-body' }, [
      el('h4', { text: step.module }),
      el('p', { class: 'why', text: '为什么：' + (step.why || '—') }),
    ]);
    (step.whatToRead || []).forEach(path => {
      body.appendChild(el('p', {}, [fileBtn(path)]));
    });
    (step.whatToUnderstand || []).forEach(item => body.appendChild(el('p', { text: '理解：' + item })));
    if (step.skip && step.skip.length) {
      body.appendChild(el('p', { class: 'path-skip', text: '先跳过：' + step.skip.join('；') }));
    }
    main.appendChild(el('div', {
      class: 'path-step', 'data-kind': 'path-step', 'data-id': String(index),
    }, [el('div', { class: 'path-idx', text: String(index + 1) }), body]));
  });
}

/* ── 主渲染 ───────────────────────────────────────────── */
function render() {
  renderTabs();
  const main = $('#main');
  main.innerHTML = '';
  if (state.view === 'overview') renderOverview(main);
  else if (state.view === 'architecture') renderArchitecture(main);
  else if (state.view === 'deps') renderDeps(main);
  else if (state.view === 'flows') renderFlows(main);
  else if (state.view === 'modules') renderModules(main);
  else if (state.view === 'path') renderPath(main);
  renderDetail();
}

/* ── 搜索 ─────────────────────────────────────────────── */
function buildSearchIndex() {
  const index = [];
  TOUR.overviewNodes.forEach(node => index.push({
    kind: 'overview-node', id: node.id, title: node.label,
    sub: [node.file || (node.keyFiles || [])[0], node.responsibility].filter(Boolean).join(' · '),
    haystack: [node.id, node.label, node.responsibility, (node.keyFiles || []).join(' '), (node.keySymbols || []).join(' ')].join(' ').toLowerCase(),
  }));
  TOUR.modules.forEach(mod => index.push({
    kind: 'module', id: mod.id, title: mod.id,
    sub: [(mod.packages || []).join(' '), mod.responsibility].filter(Boolean).join(' · '),
    haystack: [mod.id, (mod.packages || []).join(' '), mod.responsibility, (mod.keyFiles || []).join(' '), (mod.keySymbols || []).join(' ')].join(' ').toLowerCase(),
  }));
  Object.keys(flowById).forEach(flowId => {
    flowById[flowId].nodes.forEach(node => index.push({
      kind: 'flow-node', id: node.id, flowId, title: node.label,
      sub: [node.crate, node.file, node.symbol].filter(Boolean).join(' · '),
      haystack: [node.label, node.crate, node.file, node.symbol, node.responsibility].filter(Boolean).join(' ').toLowerCase(),
    }));
  });
  return index;
}
let SEARCH_INDEX = [];

function openSearchHit(hit) {
  if (hit.kind === 'overview-node') {
    apply({ view: 'architecture', flowId: null, sel: { kind: 'overview-node', id: hit.id } });
  } else if (hit.kind === 'module') {
    apply({ view: 'deps', flowId: null, sel: { kind: 'module', id: hit.id } });
  } else if (hit.kind === 'flow-node') {
    apply({ view: 'flows', flowId: hit.flowId, sel: { kind: 'flow-node', id: hit.id, flowId: hit.flowId } });
  }
}

function setupSearch() {
  const input = $('#search');
  const results = $('#searchResults');
  SEARCH_INDEX = buildSearchIndex();
  const close = () => results.classList.remove('open');
  const run = () => {
    const query = input.value.trim().toLowerCase();
    results.innerHTML = '';
    if (query.length < 1) { close(); return; }
    const hits = SEARCH_INDEX.filter(item => item.haystack.includes(query)).slice(0, 24);
    if (!hits.length) {
      results.appendChild(el('div', { class: 'search-empty', text: '无匹配' }));
    }
    hits.forEach(hit => {
      results.appendChild(el('button', {
        class: 'search-hit', type: 'button',
        onmousedown: event => { event.preventDefault(); openSearchHit(hit); close(); input.blur(); },
      }, [
        el('span', { class: 'hit-kind', text: VIEW_TITLES[{ 'overview-node': 'architecture', 'module': 'deps', 'flow-node': 'flows' }[hit.kind]] }),
        el('span', { text: hit.title }),
        el('span', { class: 'hit-sub', text: hit.sub }),
      ]));
    });
    results.classList.add('open');
  };
  input.addEventListener('input', run);
  input.addEventListener('focus', run);
  input.addEventListener('keydown', event => {
    if (event.key === 'Escape') { close(); input.blur(); }
    if (event.key === 'Enter') {
      const first = $('.search-hit', results);
      if (first) first.dispatchEvent(new MouseEvent('mousedown'));
    }
  });
  document.addEventListener('click', event => {
    if (!event.target.closest('.search-wrap')) close();
  });
}

/* ── 事件委托 ─────────────────────────────────────────── */
function handleClick(event) {
  const target = event.target;
  const fileLink = target.closest('[data-file]');
  if (fileLink) { copyText(fileLink.getAttribute('data-file')); return; }
  const zoomBtn = target.closest('[data-zoom]');
  if (zoomBtn) { onZoomClick(event); return; }
  const depsModeBtn = target.closest('[data-deps-mode]');
  if (depsModeBtn) {
    apply({ view: 'deps', depsMode: depsModeBtn.getAttribute('data-deps-mode'), sel: state.sel });
    return;
  }
  const flowCard = target.closest('[data-flow]');
  if (flowCard) {
    apply({ view: 'flows', flowId: flowCard.getAttribute('data-flow'), sel: null });
    return;
  }
  const viewBtn = target.closest('[data-view]');
  if (viewBtn) {
    const view = viewBtn.getAttribute('data-view');
    apply({ view, flowId: view === 'flows' ? state.flowId : null, sel: state.sel && state.sel.kind === 'module' && view !== 'deps' ? state.sel : (view === 'deps' ? state.sel : null) });
    return;
  }
  const clickable = target.closest('[data-kind]');
  if (clickable) {
    const kind = clickable.getAttribute('data-kind');
    const id = clickable.getAttribute('data-id');
    const sel = kind === 'flow-node'
      ? { kind, id, flowId: state.flowId }
      : { kind, id: kind === 'path-step' ? Number(id) : id };
    const same = state.sel && state.sel.kind === sel.kind && String(state.sel.id) === String(sel.id);
    apply({ sel: same ? null : sel });
    return;
  }
}

let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const canvas = activeCanvas();
    if (!canvas) return;
    canvas.style.transform = '';
    if (canvas.__scale) applyZoom(canvas, canvas.__scale);
    if (state.view === 'architecture') drawEdges(canvas, TOUR.overviewEdges, overviewHighlight());
    else if (state.view === 'deps') drawEdges(canvas, depEdgesFor(state.depsMode), moduleHighlight());
    else if (state.view === 'flows' && state.flowId) drawEdges(canvas, flowById[state.flowId].edges, null);
  }, 150);
}

/* ── 启动 ─────────────────────────────────────────────── */
function boot() {
  restoreState();
  $('#btnBack').addEventListener('click', goBack);
  document.addEventListener('click', handleClick);
  window.addEventListener('resize', onResize);
  setupSearch();
  render();
}

boot();
</script>
</body>
